name: CI/CD action
on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  testing:
    runs-on: ubuntu-latest

    env:
      PG_USER: ${{ secrets.PG_USER }}
      PG_PASS: ${{ secrets.PG_PASS }}
      PG_DB: ${{ secrets.PG_DB }}
      PG_HOST: localhost
      PG_PORT: 5432

    services:
      postgres_main:
        image: postgres:latest
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install psycopg2-binary flake8
      - name: Linter
        run: flake8 test_project --exclude migrations --ignore E501,F401,E302,W293,W391,W292
      - name: Migrations
        run: python test_project/manage.py migrate
        env:
          PG_USER: ${{ env.PG_USER }}
          PG_PASS: ${{ env.PG_PASS }}
          PG_DB: ${{ env.PG_DB }}
          PG_HOST: ${{ env.PG_HOST }}
          PG_PORT: ${{ env.PG_PORT }}
      - name: Tests
        run: python test_project/manage.py test
        env:
          PG_USER: ${{ env.PG_USER }}
          PG_PASS: ${{ env.PG_PASS }}
          PG_DB: ${{ env.PG_DB }}
          PG_HOST: ${{ env.PG_HOST }}
          PG_PORT: ${{ env.PG_PORT }}

  deploy:
    runs-on: ubuntu-latest
    needs: testing
    if: success()

    steps:
      - name: deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            # =============================================
            # 1. ЗАПУСК setup_server.sh
            # =============================================
            if [ -f "/root/setup_server.sh" ]; then
              echo "🔄 Запускаем setup_server.sh для первичной настройки..."
              bash /root/setup_server.sh
            else
              echo "⚠️ setup_server.sh не найден в /root/. Пропускаем..."
            fi

            # =============================================
            # 2. ОБНОВЛЕНИЕ КОДА
            # =============================================
            echo "📦 Обновляем код проекта..."
            cd /opt/app
            git pull

            # Проверка, что сайт работает
            sleep 3
            if curl -s http://localhost:8000 > /dev/null; then
              echo "✅ Деплой успешен!"
            else
              echo "❌ Ошибка: сервер не отвечает!"
              exit 1
            fi