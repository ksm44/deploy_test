name: CI/CD action
on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  testing:
    runs-on: ubuntu-latest

    env:
      PG_USER: ${{ secrets.PG_USER }}
      PG_PASS: ${{ secrets.PG_PASS }}
      PG_DB: ${{ secrets.PG_DB }}
      PG_HOST: localhost
      PG_PORT: 5432

    services:
      postgres_main:
        image: postgres:latest
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install psycopg2-binary flake8
      - name: Linter
        run: flake8 test_project --exclude migrations --ignore E501,F401,E302,W293,W391,W292
      - name: Migrations
        run: python test_project/manage.py migrate
        env:
          PG_USER: ${{ env.PG_USER }}
          PG_PASS: ${{ env.PG_PASS }}
          PG_DB: ${{ env.PG_DB }}
          PG_HOST: ${{ env.PG_HOST }}
          PG_PORT: ${{ env.PG_PORT }}
      - name: Tests
        run: python test_project/manage.py test
        env:
          PG_USER: ${{ env.PG_USER }}
          PG_PASS: ${{ env.PG_PASS }}
          PG_DB: ${{ env.PG_DB }}
          PG_HOST: ${{ env.PG_HOST }}
          PG_PORT: ${{ env.PG_PORT }}

  deploy:
    runs-on: ubuntu-latest
    needs: testing
    if: success()

    steps:
      - name: deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            if [ ! -d "/opt/app" ]; then
              echo "🔄 Проект не найден. Выполняем первичную настройку..."
              cd /opt
              git clone https://github.com/ksm44/deploy_test.git app
              cd app
              python3 -m venv venv
              source venv/bin/activate
              pip install -r requirements.txt gunicorn
              echo "SECRET_KEY=\"$(python3 -c 'from django.core.management.utils import get_random_secret_key; print(get_random_secret_key())')\"" > /etc/django.env
              echo "DEBUG=\"False\"" >> /etc/django.env
              echo "ALLOWED_HOSTS=\"194.58.102.17,localhost\"" >> /etc/django.env
              cat > /etc/systemd/system/gunicorn.service << "GUNICORN_EOF"
            [Unit]
            Description=gunicorn daemon
            After=network.target
            [Service]
            User=root
            Group=www-data
            WorkingDirectory=/opt/app
            EnvironmentFile=/etc/django.env
            ExecStart=/opt/app/venv/bin/gunicorn --workers 3 --bind unix:/opt/app/gunicorn.sock test_project.wsgi:application
            [Install]
            WantedBy=multi-user.target
            GUNICORN_EOF
              systemctl daemon-reload
              systemctl enable gunicorn
              systemctl start gunicorn
              cat > /etc/nginx/sites-available/django << "NGINX_EOF"
            server {
                listen 80;
                server_name 194.58.102.17;
                location /static/ { root /opt/app; }
                location /media/ { root /opt/app; }
                location / {
                    include proxy_params;
                    proxy_pass http://unix:/opt/app/gunicorn.sock;
                }
            }
            NGINX_EOF
              ln -sf /etc/nginx/sites-available/django /etc/nginx/sites-enabled
              nginx -t && systemctl restart nginx
              echo "✅ Первичная настройка завершена!"
            fi
            echo "📦 Обновляем проект..."
            cd /opt/app
            git pull
            source venv/bin/activate
            pip install -r requirements.txt gunicorn
            python manage.py migrate
            python manage.py collectstatic --noinput
            systemctl restart gunicorn
            sleep 3
            if curl -s http://localhost:8000 > /dev/null; then
              echo "✅ Деплой успешен!"
            else
              echo "❌ Ошибка: сервер не отвечает!"
              exit 1
            fi